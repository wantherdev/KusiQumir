<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="valle-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ba3d9"/>
      <stop offset="100%" stop-color="#a8d8ea"/>
    </linearGradient>
    <linearGradient id="valle-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b9b37"/>
      <stop offset="100%" stop-color="#4a7a28"/>
    </linearGradient>
    <linearGradient id="valle-river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#6bb3e8"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#valle-sky)"/>

  <!-- Clouds -->
  <ellipse cx="300" cy="100" rx="120" ry="35" fill="#fff" opacity="0.5"/>
  <ellipse cx="350" cy="90" rx="90" ry="30" fill="#fff" opacity="0.6"/>
  <ellipse cx="800" cy="130" rx="100" ry="30" fill="#fff" opacity="0.45"/>

  <!-- Mountains -->
  <path d="M0,500 L150,280 L300,400 L500,220 L700,380 L900,250 L1100,350 L1200,300 L1200,800 L0,800 Z" fill="#5a7a4a" opacity="0.5"/>

  <!-- Valley sides -->
  <path d="M0,800 L0,400 Q200,350 400,500 Q600,600 800,450 Q1000,350 1200,400 L1200,800 Z" fill="url(#valle-green)"/>

  <!-- Terraced fields -->
  <g opacity="0.9">
    <rect x="100" y="500" width="250" height="15" rx="3" fill="#7ab342"/>
    <rect x="120" y="525" width="220" height="15" rx="3" fill="#6ba337"/>
    <rect x="140" y="550" width="190" height="15" rx="3" fill="#5c932c"/>
    <rect x="160" y="575" width="160" height="15" rx="3" fill="#4d8321"/>
  </g>

  <!-- River winding through valley -->
  <path d="M600,300 Q650,350 620,400 Q590,450 630,500 Q670,550 640,600 Q610,650 650,700 L700,800" stroke="url(#valle-river)" stroke-width="25" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M605,310 Q655,355 625,405 Q595,455 635,505 Q675,555 645,605 Q615,655 655,705" stroke="#8dc8f0" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Small village -->
  <rect x="750" y="420" width="30" height="25" rx="2" fill="#c4a060"/>
  <polygon points="750,420 765,405 780,420" fill="#8b4513"/>
  <rect x="790" y="425" width="25" height="20" rx="2" fill="#d4b070"/>
  <polygon points="790,425 802,412 815,425" fill="#8b4513"/>
  <rect x="820" y="418" width="28" height="27" rx="2" fill="#c4a060"/>
  <polygon points="820,418 834,403 848,418" fill="#8b4513"/>

  <!-- Church tower -->
  <rect x="770" y="380" width="15" height="40" rx="1" fill="#d4c4a0"/>
  <polygon points="770,380 777,365 785,380" fill="#8b4513"/>
  <circle cx="777" cy="372" r="3" fill="#ffd66b"/>

  <!-- Agricultural plots -->
  <rect x="400" y="480" width="80" height="60" rx="4" fill="#8bc34a" opacity="0.7"/>
  <rect x="400" y="480" width="40" height="60" rx="4" fill="#7cb342" opacity="0.7"/>
  <rect x="500" y="500" width="70" height="50" rx="4" fill="#9ccc65" opacity="0.6"/>
  <rect x="500" y="500" width="35" height="50" rx="4" fill="#8bc34a" opacity="0.6"/>

  <!-- Foreground -->
  <path d="M0,700 Q300,660 600,700 Q900,660 1200,700 L1200,800 L0,800 Z" fill="#3d6b28"/>

  <!-- Flowers/plants -->
  <circle cx="200" cy="710" r="4" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="220" cy="705" r="3" fill="#ffd66b" opacity="0.6"/>
  <circle cx="450" cy="715" r="4" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="800" cy="708" r="3" fill="#ffd66b" opacity="0.7"/>
  <circle cx="1000" cy="712" r="4" fill="#ff6b6b" opacity="0.5"/>
</svg>
