<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pack1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="pack1-mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#pack1-sky)"/>

  <!-- Sun -->
  <circle cx="950" cy="120" r="55" fill="#ffd66b" opacity="0.9"/>
  <circle cx="950" cy="120" r="75" fill="#ffd66b" opacity="0.12"/>

  <!-- Clouds -->
  <ellipse cx="300" cy="130" rx="100" ry="30" fill="#fff" opacity="0.5"/>
  <ellipse cx="350" cy="120" rx="70" ry="25" fill="#fff" opacity="0.6"/>

  <!-- Mountain range -->
  <path d="M0,500 L200,300 L400,450 L600,250 L800,400 L1000,280 L1200,420 L1200,800 L0,800 Z" fill="url(#pack1-mountain)" opacity="0.6"/>

  <!-- Huayna Picchu -->
  <path d="M450,800 L560,280 L600,240 L640,280 L750,800 Z" fill="#4c1d95"/>
  <path d="M560,280 L580,250 L600,240 L620,250 L640,280" fill="#e8e0f0" opacity="0.7"/>

  <!-- MP Terraces -->
  <rect x="490" y="350" width="180" height="10" rx="2" fill="#00abaa" opacity="0.9"/>
  <rect x="500" y="368" width="160" height="10" rx="2" fill="#009e9d"/>
  <rect x="510" y="386" width="140" height="10" rx="2" fill="#008f8e"/>
  <rect x="520" y="404" width="120" height="10" rx="2" fill="#007f7e"/>

  <!-- Stone structures -->
  <rect x="520" y="320" width="18" height="30" rx="2" fill="#c4a97d"/>
  <rect x="545" y="315" width="22" height="35" rx="2" fill="#b89968"/>
  <rect x="575" y="322" width="16" height="28" rx="2" fill="#c4a97d"/>
  <rect x="600" y="325" width="20" height="25" rx="2" fill="#b89968"/>

  <!-- Train -->
  <rect x="100" y="580" width="300" height="50" rx="8" fill="#1a1a2e"/>
  <rect x="110" y="570" width="60" height="20" rx="4" fill="#ffd66b"/>
  <rect x="180" y="570" width="60" height="20" rx="4" fill="#ffd66b"/>
  <rect x="250" y="570" width="60" height="20" rx="4" fill="#ffd66b"/>
  <!-- Wheels -->
  <circle cx="150" cy="635" r="12" fill="#333"/>
  <circle cx="150" cy="635" r="6" fill="#666"/>
  <circle cx="250" cy="635" r="12" fill="#333"/>
  <circle cx="250" cy="635" r="6" fill="#666"/>
  <circle cx="350" cy="635" r="12" fill="#333"/>
  <circle cx="350" cy="635" r="6" fill="#666"/>

  <!-- Train tracks -->
  <line x1="0" y1="648" x2="1200" y2="648" stroke="#888" stroke-width="3"/>
  <line x1="0" y1="655" x2="1200" y2="655" stroke="#888" stroke-width="3"/>
  <g stroke="#666" stroke-width="2">
    <line x1="50" y1="645" x2="50" y2="658"/>
    <line x1="100" y1="645" x2="100" y2="658"/>
    <line x1="150" y1="645" x2="150" y2="658"/>
    <line x1="200" y1="645" x2="200" y2="658"/>
    <line x1="250" y1="645" x2="250" y2="658"/>
    <line x1="300" y1="645" x2="300" y2="658"/>
    <line x1="350" y1="645" x2="350" y2="658"/>
    <line x1="400" y1="645" x2="400" y2="658"/>
  </g>

  <!-- Foreground -->
  <path d="M0,700 L1200,700 L1200,800 L0,800 Z" fill="#1a1a2e"/>
</svg>
