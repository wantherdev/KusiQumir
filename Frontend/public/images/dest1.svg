<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cusco-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#87ceeb"/>
    </linearGradient>
    <linearGradient id="cusco-mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6f4e"/>
      <stop offset="60%" stop-color="#6b5238"/>
      <stop offset="100%" stop-color="#4a3728"/>
    </linearGradient>
    <linearGradient id="cusco-mp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8a5a"/>
      <stop offset="100%" stop-color="#3d6b3d"/>
    </linearGradient>
    <linearGradient id="cusco-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a97d"/>
      <stop offset="100%" stop-color="#a08060"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="800" fill="url(#cusco-sky)"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="120" rx="100" ry="35" fill="#fff" opacity="0.6"/>
  <ellipse cx="250" cy="110" rx="80" ry="30" fill="#fff" opacity="0.7"/>
  <ellipse cx="900" cy="150" rx="90" ry="30" fill="#fff" opacity="0.5"/>
  <ellipse cx="950" cy="140" rx="70" ry="25" fill="#fff" opacity="0.6"/>

  <!-- Sun -->
  <circle cx="1000" cy="100" r="60" fill="#ffd66b" opacity="0.9"/>
  <circle cx="1000" cy="100" r="80" fill="#ffd66b" opacity="0.15"/>

  <!-- Far mountains -->
  <path d="M0,450 L100,300 L250,400 L400,280 L550,380 L700,260 L850,350 L1000,290 L1200,400 L1200,800 L0,800 Z" fill="#7a6b5a" opacity="0.5"/>

  <!-- Huayna Picchu -->
  <path d="M400,800 L500,300 L540,260 L580,300 L680,800 Z" fill="url(#cusco-mountain)"/>
  <path d="M500,300 L520,270 L540,260 L560,270 L580,300" fill="#9a8a6a" opacity="0.5"/>
  <path d="M510,280 L530,265 L540,260 L545,268 L530,278 Z" fill="#f0f0f0" opacity="0.6"/>

  <!-- Machu Picchu terraces -->
  <rect x="420" y="380" width="200" height="10" rx="2" fill="url(#cusco-mp)"/>
  <rect x="430" y="398" width="180" height="10" rx="2" fill="#4a7a4a"/>
  <rect x="440" y="416" width="160" height="10" rx="2" fill="#3d6b3d"/>
  <rect x="450" y="434" width="140" height="10" rx="2" fill="#336033"/>
  <rect x="460" y="452" width="120" height="10" rx="2" fill="#2d552d"/>

  <!-- Stone buildings -->
  <rect x="470" y="350" width="24" height="30" rx="2" fill="url(#cusco-stone)"/>
  <rect x="500" y="345" width="28" height="35" rx="2" fill="#b89968"/>
  <rect x="535" y="352" width="20" height="28" rx="2" fill="url(#cusco-stone)"/>
  <rect x="560" y="355" width="22" height="25" rx="2" fill="#b89968"/>
  <rect x="445" y="358" width="18" height="22" rx="2" fill="#c4a97d"/>

  <!-- Window details -->
  <rect x="478" y="358" width="6" height="8" rx="1" fill="#4a3728" opacity="0.6"/>
  <rect x="510" y="355" width="7" height="9" rx="1" fill="#4a3728" opacity="0.6"/>
  <rect x="541" y="360" width="5" height="7" rx="1" fill="#4a3728" opacity="0.6"/>

  <!-- Mist in valley -->
  <ellipse cx="300" cy="550" rx="200" ry="40" fill="#fff" opacity="0.15"/>
  <ellipse cx="800" cy="520" rx="180" ry="35" fill="#fff" opacity="0.12"/>

  <!-- Foreground hills -->
  <path d="M0,650 L200,550 L400,620 L600,560 L800,630 L1000,570 L1200,640 L1200,800 L0,800 Z" fill="#4a3728" opacity="0.8"/>

  <!-- Vegetation -->
  <path d="M100,630 Q120,580 140,630 Q160,590 180,630" fill="#2d552d" opacity="0.7"/>
  <path d="M900,610 Q920,560 940,610 Q960,570 980,610" fill="#2d552d" opacity="0.6"/>

  <!-- Ground -->
  <path d="M0,720 L1200,720 L1200,800 L0,800 Z" fill="#3d2b1a"/>
</svg>
