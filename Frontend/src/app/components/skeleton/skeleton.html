<div role="status" aria-label="Cargando" class="animate-pulse space-y-4" [class]="className">
  <ng-container *ngIf="variant === 'card'">
    <div class="h-48 rounded-2xl bg-slate-200"></div>
    <div class="space-y-3 p-4">
      <div class="h-4 w-1/4 rounded bg-slate-200"></div>
      <div class="h-6 w-3/4 rounded bg-slate-200"></div>
      <div class="h-4 w-full rounded bg-slate-200"></div>
      <div class="h-4 w-2/3 rounded bg-slate-200"></div>
      <div class="flex gap-2 pt-2">
        <div class="h-6 w-16 rounded-full bg-slate-200"></div>
        <div class="h-6 w-20 rounded-full bg-slate-200"></div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="variant === 'text'">
    <div class="h-4 w-3/4 rounded bg-slate-200"></div>
    <div class="h-4 rounded bg-slate-200"></div>
    <div class="h-4 w-5/6 rounded bg-slate-200"></div>
    <div class="h-4 w-1/2 rounded bg-slate-200"></div>
  </ng-container>

  <ng-container *ngIf="variant === 'table-row'">
    <div *ngFor="let _ of [].constructor(rows)" class="flex gap-4 border-b border-slate-100 py-4">
      <div *ngFor="let _ of [].constructor(cols)" class="h-4 flex-1 rounded bg-slate-200"></div>
    </div>
  </ng-container>

  <ng-container *ngIf="variant === 'hero'">
    <div class="h-[60vh] rounded-3xl bg-slate-200"></div>
  </ng-container>

  <span class="sr-only">Cargando contenido…</span>
</div>
