<div class="min-h-screen bg-slate-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Blog</h1>
        <p class="mt-2 text-sm text-slate-600">Administra los artículos del blog.</p>
      </div>
      <button (click)="open()" class="rounded-2xl bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-dark">Nuevo artículo</button>
    </div>

    <p *ngIf="successMessage" class="mb-4 rounded-2xl bg-green-50 p-4 text-sm text-green-800">{{ successMessage }}</p>
    <p *ngIf="errorMessage" class="mb-4 rounded-2xl bg-red-50 p-4 text-sm text-red-800">{{ errorMessage }}</p>

    <div *ngIf="isLoading" class="space-y-2">
      <app-skeleton *ngFor="let _ of [].constructor(5)" variant="table-row" [rows]="1" [cols]="4" />
    </div>
    <div class="overflow-x-auto overflow-hidden rounded-2xl bg-white shadow">
      <p *ngIf="articles.length === 0" class="p-8 text-center text-slate-500">No hay artículos.</p>
      <table *ngIf="articles.length" class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">Título</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">Categoría</th>
            <th class="px-6 py-3 text-left text-xs font-medium uppercase text-slate-500">Estado</th>
            <th class="px-6 py-3 text-right text-xs font-medium uppercase text-slate-500">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200">
          <tr *ngFor="let a of articles; trackBy: trackByFn">
            <td class="px-6 py-4 text-sm font-medium text-slate-900">{{ a.title }}</td>
            <td class="px-6 py-4 text-sm text-slate-500">{{ a.category || '-' }}</td>
            <td class="px-6 py-4 text-sm">{{ a.status }}</td>
            <td class="px-6 py-4 text-right text-sm">
              <button (click)="open(a)" class="mr-4 text-primary hover:text-primary-dark">Editar</button>
              <button (click)="confirmDelete(a.id)" class="text-red-600 hover:text-red-900">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="isModalOpen" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/50 p-4">
    <div class="mx-auto mt-12 max-w-3xl rounded-2xl bg-white p-6 shadow-xl">
      <div class="mb-5 flex items-center justify-between">
        <h2 class="text-xl font-semibold">{{ selectedId ? 'Editar artículo' : 'Nuevo artículo' }}</h2>
        <button (click)="close()" class="text-2xl text-slate-400">×</button>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label class="block text-sm font-medium">Título *</label><input formControlName="title" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
          <div><label class="block text-sm font-medium">Slug *</label><input formControlName="slug" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
        </div>
        <div><label class="block text-sm font-medium">Extracto *</label><textarea formControlName="excerpt" rows="2" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10"></textarea></div>
        <div><label class="block text-sm font-medium">Contenido (Markdown) *</label><textarea formControlName="content" rows="8" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10 font-mono text-sm"></textarea></div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label class="block text-sm font-medium">URL de imagen</label><input formControlName="coverImage" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
          <div><label class="block text-sm font-medium">Texto alternativo</label><input formControlName="imageAlt" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
        </div>
        <div class="grid gap-4 sm:grid-cols-3">
          <div><label class="block text-sm font-medium">Categoría</label><input formControlName="category" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
          <div><label class="block text-sm font-medium">Tags</label><input formControlName="tags" placeholder="separados por coma" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
          <div><label class="block text-sm font-medium">Estado</label><select formControlName="status" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10"><option value="DRAFT">Borrador</option><option value="PUBLISHED">Publicado</option><option value="ARCHIVED">Archivado</option></select></div>
        </div>
        <div><label class="block text-sm font-medium">Publicado en</label><input type="datetime-local" formControlName="publishedAt" class="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/10" /></div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" (click)="close()" class="rounded-2xl border border-slate-300 px-4 py-2 text-sm">Cancelar</button>
          <button type="submit" [disabled]="isLoading" class="rounded-2xl bg-primary px-4 py-2 text-white disabled:opacity-50">{{ isLoading ? 'Guardando...' : 'Guardar' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>

<app-confirm-dialog
  [visible]="showConfirm"
  title="Eliminar artículo"
  message="¿Estás seguro de eliminar este artículo?"
  confirmLabel="Eliminar"
  (confirmed)="delete()"
  (cancelled)="showConfirm = false"
></app-confirm-dialog>
