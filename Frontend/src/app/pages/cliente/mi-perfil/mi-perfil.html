<div class="min-h-screen bg-slate-50 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-2xl">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-tertiary">Mi Perfil</h1>
      <p class="mt-2 text-sm text-slate-600">Administra tu información personal.</p>
    </div>

    <div *ngIf="isLoading" class="panel p-8">
      <app-skeleton variant="text" [rows]="6"></app-skeleton>
    </div>

    <div *ngIf="noProfile" class="panel p-12 text-center">
      <p class="text-slate-500">Aún no tienes un perfil de cliente.</p>
      <p class="mt-1 text-sm text-slate-400">Crea una reserva para que tu perfil se genere automáticamente.</p>
      <a routerLink="/paquetes" class="mt-4 inline-block rounded-full bg-primary px-6 py-2 text-sm font-semibold text-white transition hover:bg-primary-dark">
        Explorar paquetes
      </a>
    </div>

    <div *ngIf="!isLoading && !noProfile && profile" class="panel p-8">
      <p *ngIf="errorMessage" class="mb-4 rounded-lg bg-red-50 p-3 text-sm text-red-800">{{ errorMessage }}</p>

      <form (ngSubmit)="save()" #profileForm="ngForm">
        <div class="mb-6 border-b border-slate-200 pb-4">
          <p class="text-sm text-slate-500">Correo: <strong>{{ profile.email }}</strong></p>
        </div>

        <div class="space-y-5">
          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Nombre completo <span class="text-red-500">*</span></span>
            <input type="text" [(ngModel)]="form.name" name="name" required
              class="mt-2 w-full input" />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Teléfono</span>
            <input type="tel" [(ngModel)]="form.phone" name="phone"
              class="mt-2 w-full input" />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Nacionalidad</span>
            <input type="text" [(ngModel)]="form.nationality" name="nationality"
              class="mt-2 w-full input" />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Pasaporte / DNI</span>
            <input type="text" [(ngModel)]="form.passport" name="passport"
              class="mt-2 w-full input" />
          </label>

          <label class="block">
            <span class="text-sm font-semibold text-slate-700">Preferencias de viaje</span>
            <textarea [(ngModel)]="form.preferences" name="preferences" rows="3"
              class="mt-2 w-full input"></textarea>
          </label>
        </div>

        <div class="mt-8 flex items-center gap-4">
          <button type="submit" [disabled]="isSaving || profileForm.invalid"
            class="btn-primary disabled:bg-slate-400">
            {{ isSaving ? 'Guardando...' : 'Guardar cambios' }}
          </button>
          <a routerLink="/mis-reservas" class="text-sm text-slate-500 underline hover:text-slate-700">
            Ver mis reservas
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
