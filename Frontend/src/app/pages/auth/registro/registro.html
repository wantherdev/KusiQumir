<div class="mx-auto max-w-xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="panel p-8">
    <h1 class="text-3xl font-bold text-tertiary">Crear cuenta</h1>
    <p class="mt-2 text-sm text-slate-600">
      Regístrate para gestionar tus reservas y mucho más.
    </p>

    <form class="mt-8 space-y-6" (ngSubmit)="submit()" #registerForm="ngForm">
      <div class="space-y-4">
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Correo electrónico <span class="text-red-500">*</span></span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            #emailInput="ngModel"
            required
            email
            class="input mt-2"
            [class.border-red-300]="emailInput.invalid && emailInput.touched"
            [class.border-slate-200]="!emailInput.invalid || !emailInput.touched"
          />
          <span *ngIf="emailInput.invalid && emailInput.touched" class="mt-1 text-xs text-red-500">
            Ingresa un correo electrónico válido
          </span>
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Contraseña <span class="text-red-500">*</span></span>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              #passwordInput="ngModel"
              required
              minlength="6"
              class="input mt-2"
              [class.border-red-300]="passwordInput.invalid && passwordInput.touched"
              [class.border-slate-200]="!passwordInput.invalid || !passwordInput.touched"
            />
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Mostrar contraseña">
              <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'" aria-hidden="true"></i>
            </button>
          </div>
          <span *ngIf="passwordInput.invalid && passwordInput.touched" class="mt-1 text-xs text-red-500">
            La contraseña debe tener al menos 6 caracteres
          </span>
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Confirmar contraseña <span class="text-red-500">*</span></span>
          <div class="relative">
            <input
              [type]="showConfirm ? 'text' : 'password'"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              #confirmInput="ngModel"
              required
              class="input mt-2"
              [class.border-red-300]="confirmInput.touched && (confirmInput.invalid || (password !== confirmPassword))"
              [class.border-slate-200]="!confirmInput.touched || (!confirmInput.invalid && password === confirmPassword)"
            />
            <button type="button" (click)="showConfirm = !showConfirm" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Mostrar contraseña">
              <i [class]="showConfirm ? 'ri-eye-off-line' : 'ri-eye-line'" aria-hidden="true"></i>
            </button>
          </div>
          <span *ngIf="confirmInput.touched && password !== confirmPassword" class="mt-1 text-xs text-red-500">
            Las contraseñas no coinciden
          </span>
        </label>
      </div>

      <div class="flex flex-col gap-3">
        <button
          type="submit"
          [disabled]="isSubmitting || registerForm.invalid"
          class="btn-primary disabled:cursor-not-allowed disabled:bg-slate-400"
        >
          {{ isSubmitting ? 'Registrando...' : 'Crear cuenta' }}
        </button>
        <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>

      <p class="text-center text-sm text-slate-600">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="font-semibold text-primary hover:underline">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
