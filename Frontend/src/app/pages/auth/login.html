<div class="mx-auto max-w-xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="rounded-3xl border border-slate-200 bg-white p-8 shadow-xl">
    <h1 class="text-3xl font-bold text-slate-900">Iniciar sesión</h1>
    <p class="mt-2 text-sm text-slate-600">
      Accede a tu cuenta para gestionar tus reservas y más.
    </p>

    <form class="mt-8 space-y-6" (ngSubmit)="submit()" #loginForm="ngForm">
      <div class="space-y-4">
        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Correo electrónico <span class="text-red-500">*</span></span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            #emailInput="ngModel"
            required
            email
            class="mt-2 w-full rounded-3xl border px-4 py-3 text-sm outline-none transition focus:ring-2 focus:border-primary focus:ring-primary/10"
            [class.border-red-300]="emailInput.invalid && emailInput.touched"
            [class.border-slate-200]="!emailInput.invalid || !emailInput.touched"
          />
          <span *ngIf="emailInput.invalid && emailInput.touched" class="mt-1 text-xs text-red-500">
            Ingresa un correo electrónico válido
          </span>
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-slate-700">Contraseña <span class="text-red-500">*</span></span>
          <div class="relative">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              #passwordInput="ngModel"
              required
              minlength="6"
              class="mt-2 w-full rounded-3xl border px-4 py-3 text-sm outline-none transition focus:ring-2 focus:border-primary focus:ring-primary/10"
              [class.border-red-300]="passwordInput.invalid && passwordInput.touched"
              [class.border-slate-200]="!passwordInput.invalid || !passwordInput.touched"
            />
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" aria-label="Mostrar contraseña">
              <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
            </button>
          </div>
          <span *ngIf="passwordInput.invalid && passwordInput.touched" class="mt-1 text-xs text-red-500">
            La contraseña debe tener al menos 6 caracteres
          </span>
        </label>
      </div>

      <div class="flex flex-col gap-3">
        <button
          type="submit"
          [disabled]="isSubmitting || loginForm.invalid"
          class="inline-flex items-center justify-center rounded-3xl bg-primary px-6 py-3 text-sm font-semibold text-white transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:bg-slate-400"
        >
          {{ isSubmitting ? 'Validando...' : 'Entrar' }}
        </button>
        <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>
      </div>

      <p class="mt-6 text-center text-sm text-slate-600">
        ¿No tienes cuenta?
        <a routerLink="/registro" class="font-semibold text-primary hover:underline">Regístrate aquí</a>
      </p>
    </form>
  </div>
</div>
