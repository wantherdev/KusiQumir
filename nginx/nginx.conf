events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log  /var/log/nginx/access.log;
  error_log   /var/log/nginx/error.log warn;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 256;

  # Security
  server_tokens off;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  # CSP: Angular SSR requiere 'unsafe-inline' para styles (inyectados por el servidor).
  # withCspNonce() no está disponible en @angular/ssr@22, así que no usamos nonces.
  # Sin 'unsafe-eval', frame-src/object-src/base-uri/form-action restringidos.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' https://images.unsplash.com data: blob:; connect-src 'self' https://api.whatsapp.com https://sentry.io; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Proxy timeouts
  proxy_connect_timeout 30s;
  proxy_read_timeout 60s;
  proxy_send_timeout 30s;

  # Cache zones
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=1g inactive=7d use_temp_path=off;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name kusiqumir.com www.kusiqumir.com;
    return 301 https://$host$request_uri;
  }

  # HTTPS server
  server {
    listen 443 ssl http2;
    server_name kusiqumir.com www.kusiqumir.com;

    # SSL — reemplazar con certificados reales de Let's Encrypt
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # Static assets with content hash (chunk-*) — cache 1 año
    location ~* ^/(chunk-|polyfills|main|styles|scripts|vendor)[^/]*\.(js|css)$ {
      proxy_pass http://frontend:4000;
      proxy_hide_header Set-Cookie;
      proxy_cache static;
      proxy_cache_valid 200 1y;
      proxy_cache_use_stale error timeout updating;
      add_header Cache-Control "public, immutable, max-age=31536000";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Images, fonts, media — cache 30 días
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|mp4|webm)$ {
      proxy_pass http://frontend:4000;
      proxy_hide_header Set-Cookie;
      proxy_cache static;
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating;
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Frontend SSR — no cache (HTML dinámico)
    location / {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://frontend:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Backend API
    location /api/ {
      limit_req zone=api burst=10 nodelay;

      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # CORS handled by backend — no reflector on nginx
    }

    # Backend docs
    location /docs {
      limit_req zone=api burst=5 nodelay;
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger JSON/UI
    location /api/v1/docs {
      limit_req zone=api burst=5 nodelay;
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

  }
}
