services:
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl-certs:/etc/ssl/certs
      - certbot-www:/var/www/certbot
      - ./nginx/healthcheck.html:/usr/share/nginx/html/healthcheck.html:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - default

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthcheck.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kusiqumir"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-https://kusiqumir.com,https://www.kusiqumir.com}
      SENTRY_DSN: ${SENTRY_DSN:-}

  frontend:
    build:
      args:
        SENTRY_DSN: ${SENTRY_DSN:-}

  certbot-renew:
    image: nginx:1.27-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache certbot certbot-nginx
        while true; do
          certbot renew --quiet --no-self-upgrade
          sleep 86400
        done
    volumes:
      - ssl-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./ssl:/etc/ssl/certs
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  pgdata:
  ssl-certs:
  certbot-www:
