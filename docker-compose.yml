services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kusiqumir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kusiqumir
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kusiqumir"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbackup:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /backup.sh
          sleep 86400
        done
    volumes:
      - ./scripts/backup-db.sh:/backup.sh:ro
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      BACKUP_DIR: /backups
    depends_on:
      - postgres

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://kusiqumir:${POSTGRES_PASSWORD}@postgres:5432/kusiqumir?connection_limit=10&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      WHATSAPP_PHONE: ${WHATSAPP_PHONE:-51999000000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: unless-stopped
    environment:
      PORT: 4000
      API_URL: http://backend:3000
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/',(r)=>{process.exit(r.statusCode>=200&&r.statusCode<500?0:1)}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
