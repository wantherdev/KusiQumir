name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kusiqumir_test
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  CORS_ORIGIN: "*"
  WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}

# Required repository secrets:
#   DOCKER_USERNAME, DOCKER_PASSWORD - DockerHub credentials
#   JWT_SECRET - JWT signing secret
#   WHATSAPP_PHONE - WhatsApp business phone number
#   SENTRY_DSN - Sentry DSN (optional)
#   SSH_HOST, SSH_USER, SSH_KEY - Deploy server SSH credentials
#   DEPLOY_PATH - Deploy directory on server

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kusiqumir_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

      - run: pnpm typecheck

      - run: pnpm prisma generate

      - run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kusiqumir_test

      - run: pnpm test

      - run: pnpm build

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: Frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --audit-level=high

      - run: pnpm frontend:build

      - run: pnpm frontend:test

  docker-build:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kusiqumir-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/kusiqumir-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kusiqumir-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/kusiqumir-frontend:${{ github.sha }}

  deploy:
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
